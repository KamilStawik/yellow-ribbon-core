services:
  postgres:
    image: postgres:17-alpine
    container_name: yellow-ribbon-postgres
    environment:
      POSTGRES_DB: yellow_ribbon
      POSTGRES_USER: yellow_ribbon
      POSTGRES_PASSWORD: yellow_ribbon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yellow_ribbon -d yellow_ribbon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
